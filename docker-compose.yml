services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zkteco
      POSTGRES_PASSWORD: zkteco
      POSTGRES_DB: zkteco_adms
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zkteco"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://zkteco:zkteco@postgres:5432/zkteco_adms
      REDIS_URL: redis://redis:6379/0
      # Local-dev default so the bundled frontend (localhost:3000) can call
      # the API from the browser. PRODUCTION MUST override this with the real
      # origin(s), e.g. FRONTEND_ORIGINS_RAW=https://admin.example.com
      # (never "*" together with credentials).
      FRONTEND_ORIGINS_RAW: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    volumes:
      # JWT RS256 keys live on the host (generated per docs/DEVELOPMENT.md);
      # the image never bakes them in. Required for login to work.
      - ./backend/.jwt_private.pem:/srv/app/.jwt_private.pem:ro
      - ./backend/.jwt_public.pem:/srv/app/.jwt_public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

  hr-calendar-worker:
    profiles: ["hr-automation"]
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://zkteco:zkteco@postgres:5432/zkteco_adms
      REDIS_URL: redis://redis:6379/0
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  hr-calendar-beat:
    profiles: ["hr-automation"]
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://zkteco:zkteco@postgres:5432/zkteco_adms
      REDIS_URL: redis://redis:6379/0
    command: celery -A app.workers.celery_app:celery_app beat --loglevel=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
