name: ci
on: [push, pull_request]

defaults:
  run:
    working-directory: backend

jobs:
  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zkteco
          POSTGRES_PASSWORD: zkteco
          POSTGRES_DB: zkteco_adms_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zkteco" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://zkteco:zkteco@localhost:5432/zkteco_adms_test
      REDIS_URL: redis://localhost:6379/15
      ZKTECO_TEST_PG_URL: postgresql+asyncpg://zkteco:zkteco@localhost:5432/zkteco_adms_test
      ZKTECO_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .[dev]
      - run: ruff check app tests alembic
      - run: ruff format --check app tests alembic
      - run: mypy --strict app
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest tests --cov=app --cov-report=term-missing --cov-fail-under=60

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pip-audit
      - run: pip-audit --skip-editable
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
